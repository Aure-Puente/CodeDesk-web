# Postgres local para desarrollo y tests.
# Las credenciales salen de .env (ver .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: panel-duwoh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP a propósito: durante la inicialización (primer arranque) Postgres solo escucha por
      # socket Unix, así que el chequeo no pasa hasta que terminan los scripts de init y reinicia.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
